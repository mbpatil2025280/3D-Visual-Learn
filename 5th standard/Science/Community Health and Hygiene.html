<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Health and Hygiene</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial;
}

#title {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 26px;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 360px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
}

button {
    position: absolute;
    top: 60px;
    left: 20px;
    padding: 10px;
    background: #00cc66;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">🏥 Community Health & Hygiene</div>
<div id="info">Loading...</div>
<button onclick="playVoice()">🔊 Play Voice</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
let scene = new THREE.Scene();

// Camera
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 22;

// Renderer
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
let light = new THREE.PointLight(0xffffff, 2, 200);
light.position.set(20,20,20);
scene.add(light);

let ambient = new THREE.AmbientLight(0x404040, 2);
scene.add(ambient);

// Ground
let ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -6;
scene.add(ground);

// Houses (simple real-world feel)
let house1 = new THREE.Mesh(
    new THREE.BoxGeometry(5,4,5),
    new THREE.MeshStandardMaterial({ color: 0x888888 })
);
house1.position.set(-8,-2,0);
scene.add(house1);

let house2 = house1.clone();
house2.position.set(8,-2,0);
scene.add(house2);

// People (community)
function createPerson(x){
    let body = new THREE.Mesh(
        new THREE.CylinderGeometry(1,1,5,32),
        new THREE.MeshStandardMaterial({ color: 0x00aaff })
    );
    body.position.set(x,0,0);

    let head = new THREE.Mesh(
        new THREE.SphereGeometry(1,32,32),
        new THREE.MeshStandardMaterial({ color: 0xffcc99 })
    );
    head.position.set(x,3,0);

    scene.add(body);
    scene.add(head);
}

createPerson(-3);
createPerson(0);
createPerson(3);

// Tap (water source)
let tap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5,0.5,2,16),
    new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
);
tap.position.set(0,2,4);
scene.add(tap);

// Water drops
let water = [];
for(let i=0;i<50;i++){
    let drop = new THREE.Mesh(
        new THREE.SphereGeometry(0.1,8,8),
        new THREE.MeshStandardMaterial({ color: 0x66ccff })
    );
    scene.add(drop);
    water.push(drop);
}

// Garbage
let garbage = [];
for(let i=0;i<20;i++){
    let g = new THREE.Mesh(
        new THREE.SphereGeometry(0.3,8,8),
        new THREE.MeshStandardMaterial({ color: 0x663300 })
    );
    g.position.set(Math.random()*10-5,-5,Math.random()*10-5);
    scene.add(g);
    garbage.push(g);
}

// Germs
let germs = [];
for(let i=0;i<30;i++){
    let g = new THREE.Mesh(
        new THREE.SphereGeometry(0.2,8,8),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
    );
    scene.add(g);
    germs.push(g);
}

// Text
let info = document.getElementById("info");

let steps = [
"Community health means the health of people living together.",
"Hygiene means keeping ourselves and surroundings clean.",
"Dirty surroundings can spread diseases.",
"Washing hands with clean water removes germs.",
"Proper waste disposal keeps the environment clean.",
"Clean water and sanitation improve health.",
"Good hygiene leads to a healthy community."
];

let index = 0;

// Voice
function speak(text){
    let speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.9;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

function playVoice(){
    speak(steps[index]);
}

// Animation
function animate(){
    requestAnimationFrame(animate);

    let t = Date.now()*0.002;

    // Water flow
    water.forEach(w=>{
        w.position.x = 0 + Math.random();
        w.position.y -= 0.3;
        w.position.z = 4 + Math.random();

        if(w.position.y < -3) w.position.y = 3;
    });

    // Germ movement
    germs.forEach((g,i)=>{
        g.position.x = Math.sin(t+i)*5;
        g.position.y = Math.cos(t+i)*3;
        g.position.z = Math.cos(t+i)*5;
    });

    renderer.render(scene, camera);
}

animate();

// Text change
setInterval(()=>{
    index++;
    if(index >= steps.length) index = 0;

    info.innerHTML = steps[index];
    speak(steps[index]);

}, 6000);

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Init
info.innerHTML = steps[0];

</script>

</body>
</html>
