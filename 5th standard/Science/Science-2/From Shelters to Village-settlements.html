<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shelters to Village Settlements</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: black;
}

#title {
    position: absolute;
    top: 10px;
    left: 20px;
    color: white;
    font-size: 26px;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 380px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    color: white;
    border-radius: 10px;
}

button {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    font-size: 16px;
    background: orange;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">🏡 Shelters → Village Settlements</div>
<div id="info">Click Start to Learn</div>
<button onclick="start()">Start</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene, camera, renderer;
let shelters=[], huts=[], farms=[], village=[];
let step = 0;

const content = [
"Early humans used temporary shelters like caves and tents.",
"These shelters protected them from animals and weather.",
"Gradually, humans began building simple huts.",
"They started farming and living near rivers.",
"Huts were grouped together forming small settlements.",
"These settlements developed into organized villages."
];

// INIT
init();
animate();

function init(){

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0,6,18);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x404040));

// GROUND
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(60,60),
new THREE.MeshStandardMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// RIVER
const river = new THREE.Mesh(
new THREE.PlaneGeometry(60,6),
new THREE.MeshStandardMaterial({color:0x1E90FF})
);
river.rotation.x = -Math.PI/2;
river.position.z = -5;
scene.add(river);

// SHELTERS (TENTS)
for(let i=0;i<5;i++){
let tent = new THREE.Mesh(
new THREE.ConeGeometry(1,2,4),
new THREE.MeshStandardMaterial({color:0xffa500})
);
tent.position.set(i*3-6,1,10);
scene.add(tent);
shelters.push(tent);
}

// HUTS
for(let i=0;i<5;i++){
let hut = new THREE.Mesh(
new THREE.CylinderGeometry(1,1,2,6),
new THREE.MeshStandardMaterial({color:0x8B4513})
);
hut.position.set(i*3-6,1,3);
scene.add(hut);
huts.push(hut);
}

// FARMS
for(let i=0;i<5;i++){
let farm = new THREE.Mesh(
new THREE.BoxGeometry(2,0.2,2),
new THREE.MeshStandardMaterial({color:0x654321})
);
farm.position.set(i*3-6,0.1,-2);
scene.add(farm);
farms.push(farm);
}

// VILLAGE (HOUSES)
for(let i=0;i<6;i++){
let house = new THREE.Mesh(
new THREE.BoxGeometry(2,2,2),
new THREE.MeshStandardMaterial({color:0xffffff})
);
house.position.set((i%3)*4-4,1,-12+Math.floor(i/3)*4);
scene.add(house);
village.push(house);
}

}

// ANIMATION LOOP
function animate(){
requestAnimationFrame(animate);

// ROTATION EFFECT
shelters.forEach(s=>s.rotation.y+=0.01);
huts.forEach(h=>h.rotation.y+=0.008);
village.forEach(v=>v.rotation.y+=0.004);

// CAMERA MOVE
camera.position.x = Math.sin(Date.now()*0.0003)*15;
camera.lookAt(0,0,0);

renderer.render(scene,camera);
}

// START
function start(){
next();
}

// FLOW
function next(){

if(step < content.length){

document.getElementById("info").innerText = content[step];
speak(content[step]);
highlight(step);

step++;
setTimeout(next,6000);

}else{
document.getElementById("info").innerText = "Learning Completed!";
speak("Learning Completed");
}

}

// HIGHLIGHT VISUAL
function highlight(s){

resetColors();

if(s==0 || s==1){
shelters.forEach(x=>x.material.color.set(0xff0000));
}
if(s==2){
huts.forEach(x=>x.material.color.set(0x00ff00));
}
if(s==3){
farms.forEach(x=>x.material.color.set(0xffff00));
}
if(s>=4){
village.forEach(x=>x.material.color.set(0x0000ff));
}

}

// RESET COLORS
function resetColors(){
shelters.forEach(x=>x.material.color.set(0xffa500));
huts.forEach(x=>x.material.color.set(0x8B4513));
farms.forEach(x=>x.material.color.set(0x654321));
village.forEach(x=>x.material.color.set(0xffffff));
}

// VOICE
function speak(text){
let msg = new SpeechSynthesisUtterance(text);
msg.rate = 1;
msg.pitch = 1;
window.speechSynthesis.speak(msg);
}

// RESIZE
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
