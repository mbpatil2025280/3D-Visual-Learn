<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Historic Periods Ultra 3D</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:linear-gradient(#000428,#004e92);
    font-family:Arial;
}

#title {
    position:absolute;
    top:10px;
    left:20px;
    color:white;
    font-size:28px;
}

#info {
    position:absolute;
    bottom:20px;
    left:20px;
    width:420px;
    padding:15px;
    background:rgba(0,0,0,0.7);
    color:white;
    border-radius:10px;
}

button {
    position:absolute;
    bottom:20px;
    right:20px;
    padding:12px 18px;
    font-size:16px;
    background:orange;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.label {
    color:white;
    font-size:14px;
}
</style>
</head>

<body>

<div id="title">🌍 Historic Periods (Ultra 3D)</div>
<div id="info">Click Start to Begin</div>
<button onclick="start()">Start</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/renderers/CSS2DRenderer.js"></script>

<script>

// ================= VARIABLES =================
let scene,camera,renderer,labelRenderer;
let cave,pyramid,castle,city=[];
let step=0;

// ================= CONTENT =================
const data=[
"Prehistoric period: Humans lived in caves and used natural shelters.",
"Ancient period: Large structures like pyramids were built.",
"Medieval period: Castles and forts protected civilizations.",
"Modern period: Advanced cities with skyscrapers developed."
];

// ================= INIT =================
init();
animate();

function init(){

scene=new THREE.Scene();

// CAMERA
camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,10,30);

// RENDERER
renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

// LABEL RENDER
labelRenderer=new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth,window.innerHeight);
labelRenderer.domElement.style.position='absolute';
labelRenderer.domElement.style.top='0';
document.body.appendChild(labelRenderer.domElement);

// LIGHTS
const sun=new THREE.DirectionalLight(0xffffff,1);
sun.position.set(30,30,20);
sun.castShadow=true;
scene.add(sun);

scene.add(new THREE.AmbientLight(0x666666));

// GROUND
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(200,200),
new THREE.MeshStandardMaterial({color:0x2e7d32})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ================= LABEL FUNCTION =================
function label(text,obj){
const div=document.createElement('div');
div.className='label';
div.textContent=text;
const l=new THREE.CSS2DObject(div);
l.position.set(0,5,0);
obj.add(l);
}

// ================= CAVE =================
cave=new THREE.Group();

for(let i=0;i<15;i++){
let rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(Math.random()*2+1),
new THREE.MeshStandardMaterial({color:0x4e342e, roughness:1})
);
rock.position.set(Math.random()*6-3,Math.random()*3,Math.random()*6-3);
rock.castShadow=true;
cave.add(rock);
}

cave.position.set(-25,2,5);
scene.add(cave);
label("Cave",cave);

// ================= PYRAMID =================
pyramid=new THREE.Group();

let base=new THREE.Mesh(
new THREE.BoxGeometry(8,1,8),
new THREE.MeshStandardMaterial({color:0xc2a46d})
);
base.receiveShadow=true;
pyramid.add(base);

let top=new THREE.Mesh(
new THREE.ConeGeometry(5,6,4),
new THREE.MeshStandardMaterial({color:0xd4af37})
);
top.position.y=3;
top.castShadow=true;
pyramid.add(top);

pyramid.position.set(-10,1,0);
scene.add(pyramid);
label("Pyramid",pyramid);

// ================= CASTLE =================
castle=new THREE.Group();

// base
let main=new THREE.Mesh(
new THREE.BoxGeometry(8,5,8),
new THREE.MeshStandardMaterial({color:0x9e9e9e})
);
castle.add(main);

// towers
for(let i=0;i<4;i++){
let tower=new THREE.Mesh(
new THREE.CylinderGeometry(1.2,1.2,7,16),
new THREE.MeshStandardMaterial({color:0x757575})
);
tower.position.set(i<2?-4:4,3.5,i%2?-4:4);
castle.add(tower);
}

castle.position.set(8,3,-5);
scene.add(castle);
label("Castle",castle);

// ================= BUILDINGS =================
function createBuilding(x,z){

let b=new THREE.Group();

// body
let body=new THREE.Mesh(
new THREE.BoxGeometry(4,15,4),
new THREE.MeshStandardMaterial({color:0x2196f3, metalness:0.7})
);
body.position.y=7.5;
b.add(body);

// roof
let roof=new THREE.Mesh(
new THREE.ConeGeometry(3,3,4),
new THREE.MeshStandardMaterial({color:0x37474f})
);
roof.position.y=16;
b.add(roof);

// windows
for(let i=0;i<8;i++){
for(let j=0;j<2;j++){
let win=new THREE.Mesh(
new THREE.BoxGeometry(0.6,0.6,0.1),
new THREE.MeshStandardMaterial({color:0xffffcc})
);
win.position.set(j?1.5:-1.5,2+i*1.5,2.1);
b.add(win);
}
}

b.position.set(x,0,z);
scene.add(b);
city.push(b);
}

createBuilding(20,-12);
createBuilding(25,-8);
createBuilding(18,-6);

label("Modern City",city[0]);

}

// ================= ANIMATION =================
function animate(){
requestAnimationFrame(animate);

cave.rotation.y+=0.002;
pyramid.rotation.y+=0.003;
castle.rotation.y+=0.002;
city.forEach(b=>b.rotation.y+=0.001);

// camera motion
camera.position.x=Math.sin(Date.now()*0.0003)*25;
camera.lookAt(0,0,0);

renderer.render(scene,camera);
labelRenderer.render(scene,camera);
}

// ================= START =================
function start(){ next(); }

// ================= FLOW =================
function next(){

if(step<data.length){

document.getElementById("info").innerText=data[step];
speak(data[step]);
highlight(step);

step++;
setTimeout(next,6000);

}else{
document.getElementById("info").innerText="Completed!";
speak("Learning completed");
}

}

// ================= HIGHLIGHT =================
function highlight(s){

reset();

if(s==0) cave.children.forEach(r=>{if(r.isMesh) r.material.color.set(0xff5722);});
if(s==1) pyramid.children.forEach(p=>{if(p.isMesh) p.material.color.set(0xffeb3b);});
if(s==2) castle.children.forEach(c=>{if(c.isMesh) c.material.color.set(0x4caf50);});
if(s==3) city.forEach(b=>{if(b.children[0].isMesh) b.children[0].material.color.set(0x03a9f4);});

}

// ================= RESET =================
function reset(){
cave.children.forEach(r=>{if(r.isMesh) r.material.color.set(0x4e342e);});
pyramid.children[0].material.color.set(0xc2a46d);
pyramid.children[1].material.color.set(0xd4af37);
castle.children.forEach(c=>{if(c.isMesh) c.material.color.set(0x9e9e9e);});
city.forEach(b=>{if(b.children[0].isMesh) b.children[0].material.color.set(0x2196f3);});
}

// ================= VOICE =================
function speak(text){
let msg=new SpeechSynthesisUtterance(text);
msg.rate=1;
msg.pitch=1;
window.speechSynthesis.speak(msg);
}

// ================= RESIZE =================
window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
labelRenderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
