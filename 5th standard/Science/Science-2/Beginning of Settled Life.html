<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Beginning of Settled Life - 3D Learning</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial;
        background: black;
    }

    #title {
        position: absolute;
        top: 10px;
        left: 20px;
        color: white;
        font-size: 26px;
    }

    #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 360px;
        padding: 15px;
        background: rgba(0,0,0,0.7);
        color: white;
        border-radius: 10px;
    }

    button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        font-size: 16px;
        background: orange;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="title">🌱 Beginning of Settled Life</div>
<div id="info">Click Start to Learn</div>
<button onclick="start()">Start</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene, camera, renderer;
let tents = [], farms = [], houses = [];
let step = 0;

const content = [
    "Early humans were nomadic. They moved in search of food.",
    "They started settling near rivers for water.",
    "They learned farming and grew crops.",
    "Animals were domesticated for help.",
    "Small villages were formed with huts.",
    "This marked the beginning of settled life."
];

// INIT
init();
animate();

function init() {

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        75, window.innerWidth/window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 6, 15);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // LIGHTS
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10,10,5);
    scene.add(light);

    const ambient = new THREE.AmbientLight(0x404040);
    scene.add(ambient);

    // GROUND
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50,50),
        new THREE.MeshStandardMaterial({color:0x228B22})
    );
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // RIVER
    const river = new THREE.Mesh(
        new THREE.PlaneGeometry(50,5),
        new THREE.MeshStandardMaterial({color:0x1E90FF})
    );
    river.rotation.x = -Math.PI/2;
    river.position.z = -5;
    scene.add(river);

    // TENTS (Nomadic life)
    for(let i=0;i<5;i++){
        const tent = new THREE.Mesh(
            new THREE.ConeGeometry(1,2,4),
            new THREE.MeshStandardMaterial({color:0xffa500})
        );
        tent.position.set(i*2-5,1,5);
        scene.add(tent);
        tents.push(tent);
    }

    // FARMS
    for(let i=0;i<5;i++){
        const farm = new THREE.Mesh(
            new THREE.BoxGeometry(2,0.2,2),
            new THREE.MeshStandardMaterial({color:0x8B4513})
        );
        farm.position.set(i*3-6,0.1,-2);
        scene.add(farm);
        farms.push(farm);
    }

    // HOUSES
    for(let i=0;i<5;i++){
        const house = new THREE.Mesh(
            new THREE.BoxGeometry(2,2,2),
            new THREE.MeshStandardMaterial({color:0xffffff})
        );
        house.position.set(i*3-6,1,8);
        scene.add(house);
        houses.push(house);
    }
}

// ANIMATION LOOP
function animate() {
    requestAnimationFrame(animate);

    // subtle motion
    tents.forEach(t => t.rotation.y += 0.01);
    houses.forEach(h => h.rotation.y += 0.005);

    camera.position.x = Math.sin(Date.now()*0.0004)*12;
    camera.lookAt(0,0,0);

    renderer.render(scene,camera);
}

// START LEARNING
function start(){
    next();
}

// STEP FLOW
function next(){
    if(step < content.length){

        document.getElementById("info").innerText = content[step];
        speak(content[step]);

        highlight(step);

        step++;
        setTimeout(next,6000);
    } else {
        speak("Learning completed");
        document.getElementById("info").innerText = "Completed!";
    }
}

// HIGHLIGHT VISUAL
function highlight(s){

    tents.forEach(t => t.material.color.set(0xffa500));
    farms.forEach(f => f.material.color.set(0x8B4513));
    houses.forEach(h => h.material.color.set(0xffffff));

    if(s==0){
        tents.forEach(t => t.material.color.set(0xff0000));
    }
    if(s==2){
        farms.forEach(f => f.material.color.set(0x00ff00));
    }
    if(s>=4){
        houses.forEach(h => h.material.color.set(0x0000ff));
    }
}

// VOICE
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.rate = 1;
    msg.pitch = 1;
    window.speechSynthesis.speak(msg);
}

// RESIZE
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
