<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Evolution of Human Civilization</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: black;
}

#title {
    position: absolute;
    top: 10px;
    left: 20px;
    color: white;
    font-size: 26px;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 380px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    color: white;
    border-radius: 10px;
}

button {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    font-size: 16px;
    background: orange;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">🌍 Evolution of Human Civilization</div>
<div id="info">Click Start to Explore</div>
<button onclick="start()">Start</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

let scene, camera, renderer;
let camps=[], farms=[], villages=[], cities=[];
let step = 0;

const content = [
"Early humans lived in the Stone Age using simple tools.",
"They were hunters and gatherers moving from place to place.",
"Humans discovered agriculture and started farming.",
"Permanent villages were formed near rivers.",
"Cities developed with trade, buildings and systems.",
"Modern civilization includes technology, transport and industries."
];

// INIT
init();
animate();

function init(){

scene = new THREE.Scene();

camera = new THREE.PerspectiveCamera(
75, window.innerWidth/window.innerHeight, 0.1, 1000
);
camera.position.set(0,6,18);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x404040));

// GROUND
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(60,60),
new THREE.MeshStandardMaterial({color:0x228B22})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// STONE AGE CAMPS
for(let i=0;i<5;i++){
let camp = new THREE.Mesh(
new THREE.ConeGeometry(1,2,4),
new THREE.MeshStandardMaterial({color:0xffa500})
);
camp.position.set(i*3-6,1,10);
scene.add(camp);
camps.push(camp);
}

// FARMS
for(let i=0;i<5;i++){
let farm = new THREE.Mesh(
new THREE.BoxGeometry(2,0.2,2),
new THREE.MeshStandardMaterial({color:0x8B4513})
);
farm.position.set(i*3-6,0.1,2);
scene.add(farm);
farms.push(farm);
}

// VILLAGES
for(let i=0;i<5;i++){
let hut = new THREE.Mesh(
new THREE.BoxGeometry(2,2,2),
new THREE.MeshStandardMaterial({color:0xffffff})
);
hut.position.set(i*3-6,1,-6);
scene.add(hut);
villages.push(hut);
}

// MODERN CITIES
for(let i=0;i<5;i++){
let city = new THREE.Mesh(
new THREE.BoxGeometry(2,Math.random()*6+4,2),
new THREE.MeshStandardMaterial({color:0xaaaaaa})
);
city.position.set(i*3-6,city.geometry.parameters.height/2,-14);
scene.add(city);
cities.push(city);
}

}

// ANIMATION LOOP
function animate(){
requestAnimationFrame(animate);

// ROTATION
camps.forEach(c=>c.rotation.y+=0.01);
villages.forEach(v=>v.rotation.y+=0.005);
cities.forEach(c=>c.rotation.y+=0.003);

// CAMERA MOVE
camera.position.x = Math.sin(Date.now()*0.0003)*15;
camera.lookAt(0,0,0);

renderer.render(scene,camera);
}

// START
function start(){
next();
}

// FLOW
function next(){

if(step < content.length){

document.getElementById("info").innerText = content[step];
speak(content[step]);
highlight(step);

step++;
setTimeout(next,6000);

}else{
document.getElementById("info").innerText = "Civilization Journey Completed!";
speak("Civilization Journey Completed");
}

}

// HIGHLIGHT
function highlight(s){

resetColors();

if(s==0 || s==1){
camps.forEach(c=>c.material.color.set(0xff0000));
}
if(s==2){
farms.forEach(f=>f.material.color.set(0x00ff00));
}
if(s==3){
villages.forEach(v=>v.material.color.set(0x0000ff));
}
if(s>=4){
cities.forEach(c=>c.material.color.set(0xffff00));
}

}

// RESET COLORS
function resetColors(){
camps.forEach(c=>c.material.color.set(0xffa500));
farms.forEach(f=>f.material.color.set(0x8B4513));
villages.forEach(v=>v.material.color.set(0xffffff));
cities.forEach(c=>c.material.color.set(0xaaaaaa));
}

// VOICE
function speak(text){
let msg = new SpeechSynthesisUtterance(text);
msg.rate = 1;
msg.pitch = 1;
window.speechSynthesis.speak(msg);
}

// RESIZE
window.addEventListener("resize",()=>{
camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

</script>

</body>
</html>
