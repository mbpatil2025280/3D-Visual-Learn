<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Life on Earth - 3D Learning</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: black;
    color: white;
}

#title {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 360px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    line-height: 1.5;
}

button {
    position: absolute;
    top: 70px;
    left: 20px;
    padding: 10px;
    background: #00c3ff;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">🌍 Life on Earth - 3D Learning</div>
<div id="info">Loading...</div>
<button onclick="playVoice()">🔊 Play Voice</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
let scene = new THREE.Scene();

// Camera
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 20;

// Renderer
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
let sunLight = new THREE.PointLight(0xffffff, 2, 200);
sunLight.position.set(30, 20, 10);
scene.add(sunLight);

let ambient = new THREE.AmbientLight(0x404040, 2);
scene.add(ambient);

// Stars
let starsGeo = new THREE.BufferGeometry();
let starVertices = [];
for (let i = 0; i < 8000; i++) {
    starVertices.push(
        Math.random()*2000 - 1000,
        Math.random()*2000 - 1000,
        Math.random()*2000 - 1000
    );
}
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
let starsMat = new THREE.PointsMaterial({ color: 0xffffff });
let stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// Earth Texture
let earthTexture = new THREE.TextureLoader().load(
'https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg'
);

// Earth
let earth = new THREE.Mesh(
    new THREE.SphereGeometry(6, 64, 64),
    new THREE.MeshStandardMaterial({ map: earthTexture })
);
scene.add(earth);

// Clouds Layer
let cloudTexture = new THREE.TextureLoader().load(
'https://threejs.org/examples/textures/earth_clouds_1024.png'
);

let clouds = new THREE.Mesh(
    new THREE.SphereGeometry(6.1, 64, 64),
    new THREE.MeshStandardMaterial({
        map: cloudTexture,
        transparent: true
    })
);
scene.add(clouds);

// Sun
let sun = new THREE.Mesh(
    new THREE.SphereGeometry(10, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0xffcc33 })
);
sun.position.set(40,0,0);
scene.add(sun);

// Birds (simple moving shapes but styled)
let birds = [];
for(let i=0;i<10;i++){
    let bird = new THREE.Mesh(
        new THREE.ConeGeometry(0.3,1,8),
        new THREE.MeshStandardMaterial({ color: 0x222222 })
    );
    scene.add(bird);
    birds.push(bird);
}

// Fish
let fishes = [];
for(let i=0;i<10;i++){
    let fish = new THREE.Mesh(
        new THREE.SphereGeometry(0.3,16,16),
        new THREE.MeshStandardMaterial({ color: 0x00aaff })
    );
    scene.add(fish);
    fishes.push(fish);
}

// Text Steps
let info = document.getElementById("info");

let steps = [
"Earth is the only known planet that supports life.",
"Life exists because of water, air and sunlight.",
"Plants produce oxygen and food through photosynthesis.",
"Animals depend on plants and other animals for survival.",
"Humans are part of the ecosystem and depend on nature.",
"The Earth maintains balance through ecosystems.",
"We must protect Earth to preserve life."
];

let index = 0;

// Voice
function speak(text){
    let speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.9;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

function playVoice(){
    speak(steps[index]);
}

// Animation
function animate(){
    requestAnimationFrame(animate);

    // Earth rotation
    earth.rotation.y += 0.002;
    clouds.rotation.y += 0.003;

    // Orbit effect
    let t = Date.now()*0.0002;
    earth.position.x = Math.cos(t)*5;
    earth.position.z = Math.sin(t)*5;

    // Birds flying
    birds.forEach((b,i)=>{
        b.position.x = Math.sin(t + i)*10;
        b.position.y = Math.cos(t + i)*5;
        b.position.z = Math.cos(t + i)*10;
    });

    // Fish swimming
    fishes.forEach((f,i)=>{
        f.position.x = Math.sin(t + i)*4;
        f.position.y = -3 + Math.cos(t + i)*1;
        f.position.z = Math.cos(t + i)*4;
    });

    renderer.render(scene, camera);
}

animate();

// Info change
setInterval(()=>{
    index++;
    if(index >= steps.length) index = 0;

    info.innerHTML = steps[index];
    speak(steps[index]);

}, 6000);

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial
info.innerHTML = steps[0];

</script>

</body>
</html>
