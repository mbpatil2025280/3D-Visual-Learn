<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Real-World Learning Environment</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; }
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 15px;
            max-width: 350px; border: 1px solid #444; pointer-events: none;
        }
        #instructions {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #aaa; font-size: 14px;
        }
        button {
            pointer-events: auto; background: #2ecc71; border: none;
            padding: 10px 20px; color: white; border-radius: 5px; cursor: pointer;
            font-weight: bold; margin-top: 10px;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h2 id="topic-title">The Anatomy of a Building</h2>
    <p id="topic-desc">Click "Start Lesson" to begin the immersive 3D experience with audio guidance.</p>
    <button onclick="startLesson()">START LESSON</button>
</div>

<div id="instructions">Use Scroll to Zoom | Click and Drag to Rotate View</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, controls, building, sun;

    function init() {
        // 1. SCENE & CAMERA
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky Blue
        scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING (Sunlight)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(50, 50, 20);
        sun.castShadow = true;
        scene.add(sun);

        // 3. ENVIRONMENT (Grass & Road)
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5e1e });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 4. THE BUILDING (Constructed from detailed parts, not just a cube)
        building = new THREE.Group();
        
        // Main Structure
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const mainBlock = new THREE.Mesh(new THREE.BoxGeometry(10, 15, 10), wallMat);
        mainBlock.position.y = 7.5;
        mainBlock.castShadow = true;
        building.add(mainBlock);

        // Roof (Real-world pitched roof)
        const roofGeo = new THREE.ConeGeometry(8, 5, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 17.5;
        roof.rotation.y = Math.PI / 4;
        building.add(roof);

        // Adding "Windows" (Physical depth)
        const winGeo = new THREE.BoxGeometry(1.5, 2, 0.2);
        const winMat = new THREE.MeshStandardMaterial({ color: 0x33e6ff, emissive: 0x112233 });
        
        for(let i = 0; i < 3; i++) {
            for(let j = 0; j < 3; j++) {
                const w = new THREE.Mesh(winGeo, winMat);
                w.position.set(-3 + (j*3), 4 + (i*4), 5.1);
                building.add(w);
            }
        }

        // Entrance Door
        const door = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.3), new THREE.MeshStandardMaterial({color: 0x4d2600}));
        door.position.set(0, 2, 5.1);
        building.add(door);

        scene.add(building);

        // 5. CONTROLS
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Gentle hover animation
        building.position.y = Math.sin(Date.now() * 0.001) * 0.5;
        
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // START GLOBAL SCOPE FUNCTIONS
    window.startLesson = function() {
        const text = "Welcome to the 3D Architecture Lesson. Notice the pitched roof designed for rain runoff and the glass windows designed for natural lighting. This is a real-world representation of structural design.";
        
        // Text-to-Speech (Sound)
        const speech = new SpeechSynthesisUtterance(text);
        speech.rate = 0.9;
        window.speechSynthesis.speak(speech);

        // Update UI
        document.getElementById('topic-title').innerText = "Module 1: Structures";
        document.getElementById('topic-desc').innerText = text;
        
        // Animation Trigger
        gsap.to(camera.position, { x: 0, y: 10, z: 25, duration: 3 });
    };

    init();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

</body>
</html>
