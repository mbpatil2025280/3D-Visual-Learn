<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Earth and its Living World 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #00050a; font-family: 'Segoe UI', sans-serif; }
        
        #ui-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 420px;
            background: rgba(10, 25, 41, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            color: #fff;
            text-align: right; 
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,210,255,0.3);
            z-index: 100;
            border-right: 5px solid #00d2ff;
        }

        h1 { margin: 0; font-size: 22px; color: #00d2ff; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.6; color: #a0aec0; margin: 15px 0; }
        
        button {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 12px 30px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            float: right;
        }
        button:hover { letter-spacing: 1px; box-shadow: 0 0 15px #00d2ff; }
        #sphere-tag { font-size: 12px; color: #2ecc71; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h1>The Living World</h1>
    <p id="msg">Earth is a unique planet where land, water, and air meet to support a vast variety of life forms. This intersection is called the Biosphere.</p>
    <button id="exploreBtn">EXPLORE BIOSPHERE</button>
    <div style="clear:both;"></div>
    <div id="sphere-tag">Active Layer: Global Ecosystem</div>
</div>

<script>
    let scene, camera, renderer, earth, atmosphere;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 45;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const earthGeo = new THREE.SphereGeometry(15, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
            color: 0x2233ff, 
            emissive: 0x112244,
            shininess: 5
        });
        earth = new THREE.Mesh(earthGeo, earthMat);
        
        const land = new THREE.Mesh(earthGeo, new THREE.MeshPhongMaterial({
            color: 0x27ae60, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        }));
        earth.add(land);
        scene.add(earth);

        const atmoGeo = new THREE.SphereGeometry(16, 64, 64);
        const atmoMat = new THREE.MeshPhongMaterial({
            color: 0x00d2ff,
            transparent: true,
            opacity: 0.2,
            side: THREE.BackSide
        });
        atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
        scene.add(atmosphere);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(50, 10, 50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x333333));

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        earth.rotation.y += 0.002;
        atmosphere.rotation.y += 0.001;
        renderer.render(scene, camera);
    }

    document.getElementById('exploreBtn').addEventListener('click', function() {
        const text = "Life on Earth exists because of the interaction between four spheres. The Lithosphere is the rocky land. The Hydrosphere is all the water. The Atmosphere is the air we breathe. The Biosphere is the living zone where all three meet.";
        
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);

        document.getElementById('msg').innerText = "All living things, from plants to animals, depend on the constant exchange of energy between these layers.";
        document.getElementById('sphere-tag').innerText = "Status: Biosphere Interdependence Active";
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
</body>
</html>
