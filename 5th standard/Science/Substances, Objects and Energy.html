<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Substances, Objects & Energy 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1c2c; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel: Bottom-Right & Right-Aligned */
        #ui-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 25px;
            color: white;
            text-align: right; 
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 100;
        }

        h1 { margin: 0; font-size: 22px; color: #ff4757; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.6; color: #ced6e0; margin: 15px 0; }
        
        button {
            background: #ff4757;
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            float: right;
        }
        button:hover { background: #ff6b81; transform: scale(1.05); }
        #energy-meter { font-size: 12px; color: #ffa502; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h1>Energy & Matter</h1>
    <p id="info">Substances like H2O can exist as different objects (Ice or Liquid) depending on the amount of Energy they contain. Energy is the ability to do work.</p>
    <button onclick="applyEnergy()">APPLY HEAT ENERGY</button>
    <div style="clear:both;"></div>
    <div id="energy-meter">Thermal Energy: 0 J</div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

    let scene, camera, renderer, crystal, molecules = [];
    let heatLevel = 0;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. LIGHTING
        const light = new THREE.PointLight(0xffffff, 1.5, 100);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // 2. SUBSTANCE: WATER MOLECULES (Sphere objects)
        const geo = new THREE.SphereGeometry(0.8, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0x70a1ff, transparent: true, opacity: 0.8 });

        for(let i=0; i<50; i++) {
            const m = new THREE.Mesh(geo, mat);
            // Arrange in a "Solid" cube structure initially
            m.position.set(
                (i % 4) * 3 - 4.5,
                (Math.floor(i / 4) % 4) * 3 - 4.5,
                (Math.floor(i / 16)) * 3 - 4.5
            );
            m.userData.origin = m.position.clone();
            scene.add(m);
            molecules.push(m);
        }

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        
        // Energy affects vibration
        molecules.forEach(m => {
            const v = heatLevel * 0.1;
            m.position.x = m.userData.origin.x + (Math.random() - 0.5) * v;
            m.position.y = m.userData.origin.y + (Math.random() - 0.5) * v;
            m.position.z = m.userData.origin.z + (Math.random() - 0.5) * v;
            
            if(heatLevel > 5) {
                // Melting effect
                m.userData.origin.y -= 0.05;
                if(m.userData.origin.y < -10) m.userData.origin.y = -10;
            }
        });

        renderer.render(scene, camera);
    }

    window.applyEnergy = function() {
        heatLevel += 2;
        const text = "As we apply thermal energy, the molecules in the substance vibrate faster. When the energy is high enough, the rigid structure of the object breaks, causing it to change state.";
        
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);

        document.getElementById('energy-meter').innerText = "Thermal Energy: " + (heatLevel * 100) + " J";
        if(heatLevel > 6) {
            document.getElementById('info').innerText = "State Change! The substance is now a liquid. Molecules are moving freely due to high kinetic energy.";
            document.getElementById('energy-meter').style.color = "#ff4757";
        }
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</body>
</html>
