<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solve Our Own Problems: 3D Innovation</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel: Bottom-Right Aligned */
        #ui-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 380px;
            background: rgba(40, 40, 40, 0.9);
            border-left: 5px solid #f1c40f;
            padding: 25px;
            color: white;
            text-align: right;
            border-radius: 10px 0 0 10px;
            box-shadow: -10px 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        h1 { margin: 0; font-size: 20px; color: #f1c40f; letter-spacing: 1px; }
        p { font-size: 14px; line-height: 1.6; color: #ddd; margin: 15px 0; }
        
        button {
            background: #f1c40f;
            border: none;
            padding: 12px 30px;
            color: #1a1a1a;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        button:hover { background: #fff; transform: scale(1.05); }
        
        #status-tag { font-size: 12px; font-weight: bold; color: #ff4757; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div id="status-tag">SYSTEM: STALLED</div>
    <h1>Let Us Solve Our Own Problems</h1>
    <p id="msg">A problem is just a puzzle waiting for a solution. When we take responsibility, we find the path to innovation. Click below to align the gears of thought.</p>
    <button onclick="fixProblem()">REPAIR & INNOVATE</button>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, gears = [], lightBulb, isRunning = false;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 35);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        const spotLight = new THREE.SpotLight(0xffffff, 1);
        spotLight.position.set(20, 50, 20);
        scene.add(spotLight);

        // 1. THE GEARS (Representing the "Mechanism" of a problem)
        const gearMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
        
        const createGear = (x, y, z, size, color) => {
            const group = new THREE.Group();
            const core = new THREE.Mesh(new THREE.CylinderGeometry(size, size, 1, 32), new THREE.MeshStandardMaterial({color: color}));
            group.add(core);

            // Adding teeth to make it a real-world gear
            for(let i=0; i<12; i++) {
                const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 1.2), new THREE.MeshStandardMaterial({color: color}));
                tooth.position.set(Math.cos(i * Math.PI/6) * size, 0, Math.sin(i * Math.PI/6) * size);
                tooth.rotation.y = -i * Math.PI/6;
                group.add(tooth);
            }
            group.position.set(x, y, z);
            group.rotation.x = Math.PI / 2;
            return group;
        };

        const gear1 = createGear(-6, 5, 0, 5, 0x555555);
        const gear2 = createGear(4, 5, 0, 4, 0x777777);
        // Misalign gear 2 initially
        gear2.position.x = 8; 

        scene.add(gear1, gear2);
        gears.push(gear1, gear2);

        // 2. THE LIGHTBULB (Representing the Solution)
        const bulbGroup = new THREE.Group();
        const glass = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 32), new THREE.MeshStandardMaterial({color: 0xffffff, transparent: true, opacity: 0.3}));
        bulbGroup.add(glass);
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 2), new THREE.MeshStandardMaterial({color: 0x333333}));
        base.position.y = -3.5;
        bulbGroup.add(base);
        
        bulbGroup.position.set(0, 18, -5);
        scene.add(bulbGroup);
        lightBulb = bulbGroup;

        const controls = new OrbitControls(camera, renderer.domElement);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if(isRunning) {
            gears[0].rotation.y += 0.02;
            gears[1].rotation.y -= 0.025;
            lightBulb.rotation.y += 0.01;
        }
        renderer.render(scene, camera);
    }

    window.fixProblem = function() {
        if(isRunning) return;

        const text = "Every obstacle is an opportunity to learn. By analyzing the breakdown and aligning our efforts, we solve our own problems and ignite the light of innovation.";
        
        // Voice Guidance
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);

        // Visual "Repair" Animation
        gsap.to(gears[1].position, { x: 3.5, duration: 2, ease: "bounce.out" });
        
        setTimeout(() => {
            isRunning = true;
            document.getElementById('status-tag').innerText = "SYSTEM: OPERATIONAL";
            document.getElementById('status-tag').style.color = "#2ecc71";
            document.getElementById('msg').innerText = "Success! The system is running smoothly because you took the initiative to fix it.";
            
            // Light up the bulb
            gsap.to(lightBulb.children[0].material, { opacity: 0.9, duration: 1 });
            lightBulb.children[0].material.emissive = new THREE.Color(0xf1c40f);
        }, 2000);
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

</body>
</html>
