<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clothes - Our Necessity</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial;
}

#title {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 26px;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 360px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
}

button {
    position: absolute;
    top: 60px;
    left: 20px;
    padding: 10px;
    background: #3399ff;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">👕 Clothes – Our Necessity</div>
<div id="info">Loading...</div>
<button onclick="playVoice()">🔊 Play Voice</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
let scene = new THREE.Scene();

// Camera
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 20;

// Renderer
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
let light = new THREE.PointLight(0xffffff, 2, 200);
light.position.set(20,20,20);
scene.add(light);

let ambient = new THREE.AmbientLight(0x404040, 2);
scene.add(ambient);

// Ground
let ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -5;
scene.add(ground);

// Human body
let body = new THREE.Mesh(
    new THREE.CylinderGeometry(2,2,8,64),
    new THREE.MeshStandardMaterial({ color: 0x888888 })
);
scene.add(body);

// Head
let head = new THREE.Mesh(
    new THREE.SphereGeometry(1.8,32,32),
    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 5;
scene.add(head);

// Clothes (shirt)
let shirt = new THREE.Mesh(
    new THREE.BoxGeometry(4.2,4,2),
    new THREE.MeshStandardMaterial({ color: 0x00aaff })
);
shirt.position.y = 1;
scene.add(shirt);

// Jacket (winter)
let jacket = new THREE.Mesh(
    new THREE.BoxGeometry(4.5,4.5,2.2),
    new THREE.MeshStandardMaterial({ color: 0xff3333 })
);
jacket.position.y = 1;
jacket.visible = false;
scene.add(jacket);

// Raincoat
let raincoat = new THREE.Mesh(
    new THREE.BoxGeometry(4.5,4.5,2.2),
    new THREE.MeshStandardMaterial({ color: 0xffff00, transparent:true, opacity:0.7 })
);
raincoat.position.y = 1;
raincoat.visible = false;
scene.add(raincoat);

// Sun
let sun = new THREE.Mesh(
    new THREE.SphereGeometry(2,32,32),
    new THREE.MeshBasicMaterial({ color: 0xffcc00 })
);
sun.position.set(8,6,0);
scene.add(sun);

// Rain drops
let rain = [];
for(let i=0;i<100;i++){
    let drop = new THREE.Mesh(
        new THREE.SphereGeometry(0.1,8,8),
        new THREE.MeshStandardMaterial({ color: 0x66ccff })
    );
    scene.add(drop);
    rain.push(drop);
}

// Snow (winter effect)
let snow = [];
for(let i=0;i<80;i++){
    let s = new THREE.Mesh(
        new THREE.SphereGeometry(0.1,8,8),
        new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    scene.add(s);
    snow.push(s);
}

// Text steps
let info = document.getElementById("info");

let steps = [
"Clothes are our basic necessity.",
"They protect us from heat, cold and rain.",
"In summer, we wear light cotton clothes.",
"In winter, we wear warm woollen clothes.",
"In rainy season, we use raincoats and umbrellas.",
"Clothes also make us look neat and confident.",
"We should wear clean and comfortable clothes."
];

let index = 0;

// Voice
function speak(text){
    let speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.9;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

function playVoice(){
    speak(steps[index]);
}

// Animation
function animate(){
    requestAnimationFrame(animate);

    let t = Date.now()*0.001;

    // Weather change logic
    let phase = Math.floor(t/5)%3;

    shirt.visible = (phase === 0);
    jacket.visible = (phase === 1);
    raincoat.visible = (phase === 2);

    // Rain animation
    rain.forEach(r=>{
        r.position.x = Math.random()*20-10;
        r.position.y -= 0.3;
        if(r.position.y < -5) r.position.y = 10;
        r.visible = (phase === 2);
    });

    // Snow animation
    snow.forEach(s=>{
        s.position.x = Math.random()*20-10;
        s.position.y -= 0.1;
        if(s.position.y < -5) s.position.y = 10;
        s.visible = (phase === 1);
    });

    renderer.render(scene, camera);
}

animate();

// Text change
setInterval(()=>{
    index++;
    if(index >= steps.length) index = 0;

    info.innerHTML = steps[index];
    speak(steps[index]);

}, 6000);

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initial
info.innerHTML = steps[0];

</script>

</body>
</html>
