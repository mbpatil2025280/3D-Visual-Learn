<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Environmental Balance</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #000000;
    color: white;
    font-family: Arial;
}

#title {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 26px;
}

#info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    width: 400px;
    padding: 15px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
}

button {
    position: absolute;
    top: 60px;
    left: 20px;
    padding: 10px;
    background: #33cc33;
    border: none;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="title">🌱 Environmental Balance</div>
<div id="info">Loading...</div>
<button onclick="playVoice()">🔊 Play Voice</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// Scene
let scene = new THREE.Scene();

// Camera
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,10,25);

// Renderer
let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
let light = new THREE.PointLight(0xffffff, 2, 200);
light.position.set(20,20,20);
scene.add(light);

let ambient = new THREE.AmbientLight(0x404040, 2);
scene.add(ambient);

// Ground
let ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100,100),
    new THREE.MeshStandardMaterial({ color: 0x228833 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2;
scene.add(ground);

// Trees
function createTree(x,z){
    let trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3,0.5,3,16),
        new THREE.MeshStandardMaterial({ color: 0x8B4513 })
    );
    trunk.position.set(x,1,z);
    scene.add(trunk);

    let leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.5,3,16),
        new THREE.MeshStandardMaterial({ color: 0x33aa33 })
    );
    leaves.position.set(x,3.5,z);
    scene.add(leaves);
}
createTree(-8,-5);
createTree(5,2);
createTree(0,7);
createTree(-3,4);

// Animals
function createAnimal(x,z,color){
    let body = new THREE.Mesh(
        new THREE.BoxGeometry(2,1,1),
        new THREE.MeshStandardMaterial({ color: color })
    );
    body.position.set(x,0,z);
    scene.add(body);

    let head = new THREE.Mesh(
        new THREE.SphereGeometry(0.5,16,16),
        new THREE.MeshStandardMaterial({ color: color })
    );
    head.position.set(x+1,z,0.25);
    scene.add(head);
}
createAnimal(-5,-2,0xff9900); // deer
createAnimal(4,5,0x666666);   // elephant

// River
let river = new THREE.Mesh(
    new THREE.BoxGeometry(20,0.1,5),
    new THREE.MeshStandardMaterial({ color: 0x3399ff })
);
river.position.set(0,-1,0);
scene.add(river);

// Sun
let sun = new THREE.Mesh(
    new THREE.SphereGeometry(2,32,32),
    new THREE.MeshBasicMaterial({ color: 0xffcc00 })
);
sun.position.set(15,15,-10);
scene.add(sun);

// Clouds
let clouds = [];
for(let i=0;i<5;i++){
    let cloud = new THREE.Mesh(
        new THREE.SphereGeometry(1.5,16,16),
        new THREE.MeshStandardMaterial({ color:0xffffff })
    );
    cloud.position.set(Math.random()*20-10,10,Math.random()*20-10);
    scene.add(cloud);
    clouds.push(cloud);
}

// Rain (optional)
let rain = [];
for(let i=0;i<100;i++){
    let drop = new THREE.Mesh(
        new THREE.SphereGeometry(0.1,8,8),
        new THREE.MeshStandardMaterial({ color:0x66ccff })
    );
    scene.add(drop);
    rain.push(drop);
}

// Text
let info = document.getElementById("info");

let steps = [
"Environmental balance means keeping nature in harmony.",
"Forests, animals, rivers, and air must coexist.",
"Cutting trees and pollution disturb this balance.",
"Water, soil, and air need to be protected.",
"Animals and humans depend on a balanced environment.",
"Planting trees, cleaning water, and reducing pollution maintain balance.",
"A balanced environment ensures healthy life for all."
];

let index = 0;

// Voice
function speak(text){
    let speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.9;
    speech.pitch = 1;
    speechSynthesis.speak(speech);
}

function playVoice(){
    speak(steps[index]);
}

// Animate
function animate(){
    requestAnimationFrame(animate);

    let t = Date.now()*0.002;

    // Clouds movement
    clouds.forEach(c=>{
        c.position.x += 0.02;
        if(c.position.x > 20) c.position.x = -20;
    });

    // Rain
    rain.forEach(r=>{
        r.position.y -= 0.3;
        r.position.x += Math.sin(t*2)*0.05;
        if(r.position.y < -2) r.position.y = 10;
        r.visible = (index%2===1); // show rain in some steps
    });

    renderer.render(scene, camera);
}

animate();

// Change text
setInterval(()=>{
    index++;
    if(index>=steps.length) index=0;

    info.innerHTML = steps[index];
    speak(steps[index]);

},6000);

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Init
info.innerHTML = steps[0];

</script>

</body>
</html>
