<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maps - Our Companions 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel: Bottom-Right & Right-Aligned */
        #ui-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 400px;
            background: rgba(0, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-right: 4px solid #00d2ff;
            color: white;
            text-align: right; /* Right align text */
            border-radius: 15px 0 0 15px;
            box-shadow: -15px 15px 40px rgba(0,0,0,0.8);
            z-index: 100;
        }

        h1 { margin: 0; font-size: 24px; color: #00d2ff; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 15px; line-height: 1.7; color: #b0c4de; margin: 20px 0; }
        
        button {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 12px 35px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.4s;
            float: right; /* Ensure button stays right */
        }
        button:hover { letter-spacing: 2px; box-shadow: 0 0 20px #00d2ff; }
        
        #coord-text { font-family: 'Courier New', monospace; font-size: 11px; color: #4facfe; margin-top: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h1>Maps: Our Companions</h1>
    <p id="lesson-text">Maps are more than drawings; they are silent companions that teach us orientation, spatial reasoning, and the courage to explore the unknown. Whether digital or paper, they ground us in our environment.</p>
    <button onclick="startNavigation()">ACTIVATE COMPANION</button>
    <div style="clear:both;"></div>
    <div id="coord-text">LAT: 20.5937° N | LONG: 78.9629° E</div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, globe, compassNeedle, grid;

    function init() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 20, 40);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 1. COSMIC BACKGROUND
        const ambient = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambient);
        const blueLight = new THREE.PointLight(0x00d2ff, 2, 100);
        blueLight.position.set(10, 20, 10);
        scene.add(blueLight);

        // 2. THE DIGITAL GLOBE (Real-world companion)
        const globeGroup = new THREE.Group();
        const geo = new THREE.SphereGeometry(12, 32, 32);
        const mat = new THREE.MeshPhongMaterial({ 
            color: 0x111111, 
            wireframe: true,
            emissive: 0x004466
        });
        globe = new THREE.Mesh(geo, mat);
        globeGroup.add(globe);

        // Inner solid core
        const core = new THREE.Mesh(new THREE.SphereGeometry(11.8, 32, 32), new THREE.MeshBasicMaterial({color: 0x00050a}));
        globeGroup.add(core);
        scene.add(globeGroup);

        // 3. THE COMPASS (The Navigator)
        const compassBase = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 0.5, 32), new THREE.MeshStandardMaterial({color: 0x333333}));
        compassBase.position.y = -15;
        scene.add(compassBase);

        compassNeedle = new THREE.Group();
        const needlePart = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4, 4), new THREE.MeshStandardMaterial({color: 0xff0000}));
        needlePart.rotation.x = Math.PI / 2;
        needlePart.position.z = 2;
        compassNeedle.add(needlePart);

        const needleBack = new THREE.Mesh(new THREE.ConeGeometry(0.8, 4, 4), new THREE.MeshStandardMaterial({color: 0xffffff}));
        needleBack.rotation.x = -Math.PI / 2;
        needleBack.position.z = -2;
        compassNeedle.add(needleBack);
        
        compassNeedle.position.y = -14.5;
        scene.add(compassNeedle);

        // 4. THE NAVIGATION GRID
        grid = new THREE.GridHelper(100, 20, 0x00d2ff, 0x002244);
        grid.position.y = -15.5;
        scene.add(grid);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.005;
        compassNeedle.rotation.y += 0.01;
        renderer.render(scene, camera);
    }

    window.startNavigation = function() {
        const text = "A map is your most loyal companion. It doesn't just show you where you are; it shows you where you can go. From the ancient mariners using the stars to modern students using GPS, maps expand our mental horizons and help us build a structured understanding of our beautiful world.";
        
        // Voice Synth
        const speech = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(speech);

        // Animation triggers
        gsap.to(camera.position, { x: 0, y: 5, z: 35, duration: 3 });
        gsap.to(globe.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 1.5, yoyo: true, repeat: 1 });
        
        document.getElementById('lesson-text').innerText = "Navigation Engaged. Learning about coordinate systems, topography, and cultural borders enhances critical thinking.";
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

</body>
</html>
