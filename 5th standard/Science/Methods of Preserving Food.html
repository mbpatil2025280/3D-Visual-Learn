<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Preservation: 3D Science Lab</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel: Bottom-Right & Right-Aligned */
        #ui-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            color: #333;
            text-align: right; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            z-index: 100;
            border-top: 5px solid #e67e22;
        }

        h1 { margin: 0; font-size: 22px; color: #d35400; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.6; color: #555; margin: 15px 0; }
        
        .btn-group { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        button {
            background: #e67e22;
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 200px;
            transition: 0.3s;
        }
        button:hover { background: #d35400; transform: translateX(-5px); }
        
        #fact-box { margin-top: 10px; font-weight: bold; color: #27ae60; font-size: 12px; }
    </style>
</head>
<body>

<div id="ui-panel">
    <h1>Food Preservation</h1>
    <p id="desc">Food spoils due to bacteria and fungi. Preservation methods change the environment so these organisms cannot grow. Choose a method to see the science in action.</p>
    
    <div class="btn-group">
        <button onclick="showMethod('Refrigeration')">1. REFRIGERATION</button>
        <button onclick="showMethod('Dehydration')">2. DEHYDRATION</button>
        <button onclick="showMethod('Canning')">3. CANNING (HEAT)</button>
    </div>
    
    <div id="fact-box">Select a method to begin the audio lesson.</div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';

    let scene, camera, renderer, fridge, jar, steam;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);
        
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 30);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // 1. REFRIGERATOR (Real-world object)
        const fridgeGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(8, 14, 6), new THREE.MeshStandardMaterial({color: 0xbdc3c7}));
        const door = new THREE.Mesh(new THREE.BoxGeometry(8.2, 14, 0.5), new THREE.MeshStandardMaterial({color: 0xdde4e7}));
        door.position.z = 3;
        fridgeGroup.add(body, door);
        fridgeGroup.position.set(-8, 7, 0);
        scene.add(fridgeGroup);
        fridge = fridgeGroup;

        // 2. PRESERVATION JAR (Canning/Pickling)
        const jarGroup = new THREE.Group();
        const glass = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 5, 32), new THREE.MeshStandardMaterial({color: 0x00d2ff, transparent: true, opacity: 0.4}));
        const lid = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 0.5, 32), new THREE.MeshStandardMaterial({color: 0x95a5a6, metalness: 0.8}));
        lid.position.y = 2.7;
        jarGroup.add(glass, lid);
        jarGroup.position.set(8, 2.5, 0);
        scene.add(jarGroup);
        jar = jarGroup;

        // 3. STEAM (For Canning Animation)
        const steamGeo = new THREE.SphereGeometry(0.5, 8, 8);
        steam = new THREE.Group();
        for(let i=0; i<5; i++) {
            const s = new THREE.Mesh(steamGeo, new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.5}));
            s.position.set(Math.random()-0.5, i, Math.random()-0.5);
            steam.add(s);
        }
        steam.position.set(8, 5, 0);
        steam.visible = false;
        scene.add(steam);

        const controls = new OrbitControls(camera, renderer.domElement);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if(steam.visible) {
            steam.children.forEach(s => {
                s.position.y += 0.05;
                if(s.position.y > 5) s.position.y = 0;
            });
        }
        renderer.render(scene, camera);
    }

    window.showMethod = function(method) {
        let info = "";
        let audioText = "";
        
        // Reset Visuals
        steam.visible = false;
        fridge.scale.set(1,1,1);
        jar.scale.set(1,1,1);

        if(method === 'Refrigeration') {
            info = "Refrigeration slows down the growth of microorganisms by keeping food at 4°C.";
            audioText = "Refrigeration. By lowering the temperature, we make bacteria sluggish. They grow much slower in the cold, keeping your milk and vegetables fresh for days.";
            gsap.to(fridge.scale, { x: 1.1, y: 1.1, z: 1.1, duration: 0.5, yoyo: true, repeat: 1 });
            gsap.to(camera.position, { x: -15, y: 10, z: 20, duration: 2 });
        } 
        else if(method === 'Dehydration') {
            info = "Dehydration removes water, which bacteria need to survive and grow.";
            audioText = "Dehydration. Water is life, even for bacteria. By drying out fruits or grains, we remove the moisture they need to multiply, allowing food to last for months.";
            gsap.to(camera.position, { x: 0, y: 20, z: 30, duration: 2 });
        }
        else if(method === 'Canning') {
            info = "Canning involves heating food to kill bacteria and sealing it in airtight jars.";
            audioText = "Canning and Pasteurization. High heat kills existing bacteria, and the airtight seal prevents new ones from entering. This creates a safe, sterile environment.";
            steam.visible = true;
            gsap.to(camera.position, { x: 15, y: 10, z: 20, duration: 2 });
        }

        document.getElementById('desc').innerText = info;
        document.getElementById('fact-box').innerText = "Vocal Lesson Playing...";
        
        const speech = new SpeechSynthesisUtterance(audioText);
        window.speechSynthesis.speak(speech);
        speech.onend = () => { document.getElementById('fact-box').innerText = "Lesson Complete."; };
    };

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

</body>
</html>
