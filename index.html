<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | 3D Visual Learning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00f2fe">
</head>
<body class="center">

<div class="login-box">
  <h2>🎓 Log In</h2>
  <form action="login.php" method="POST">
    <input type="email" name="email" placeholder="Enter Registered Email" required>
    <input type="password" name="password" placeholder="Enter Password" required>
    <button type="submit">Login</button>
  </form>
  
  <a href="register.html" class="auth-link">Don't have an account? Register here</a>
  <a href="welcome.html" class="auth-link" style="margin-top: 10px; opacity: 0.7; font-size: 0.85rem;">← Back to Home</a>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</body>
</html>
