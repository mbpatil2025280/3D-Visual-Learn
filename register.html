<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | 3D Visual Learning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00f2fe">
</head>
<body class="center">

<div class="login-box">
  <h2>✨ Create Account</h2>
  <!-- Form could submit to register.php if there is one -->
  <form action="register.php" method="POST">
    <input type="email" name="email" placeholder="Enter Email Address" required>
    <input type="password" name="password" placeholder="Create Password" required>
    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
    <button type="submit">Register Now</button>
  </form>
  
  <a href="index.html" class="auth-link">Already have an account? Login here</a>
  <a href="welcome.html" class="auth-link" style="margin-top: 10px; opacity: 0.7; font-size: 0.85rem;">← Back to Home</a>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</body>
</html>
