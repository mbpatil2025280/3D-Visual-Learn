<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Image Formation - Ray Optics</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: sans-serif; overflow: hidden; }
        #ui { position: absolute; top: 20px; left: 20px; width: 300px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 12px; border: 1px solid #00d4ff; z-index: 100; }
        input[type=range] { width: 100%; accent-color: #00d4ff; }
        .status-box { background: #111; padding: 10px; margin-top: 15px; border-radius: 5px; border-left: 4px solid #00d4ff; font-size: 0.9em; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; background: #00d4ff; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="margin:0;">Ray Optics: Convex Lens</h2>
        <label>Object Position (u): <span id="u-val">-5</span></label>
        <input type="range" id="u-slider" min="-15" max="-1.5" step="0.1" value="-10">
        
        <div class="status-box" id="image-info">
            Type: Real & Inverted<br>
            Position: Calculating...
        </div>
        
        <button onclick="playExplanation()">🔊 Explain Image Rules</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        // --- Optical Bench Elements ---
        const axisGeo = new THREE.CylinderGeometry(0.05, 0.05, 40);
        const axisMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
        const principalAxis = new THREE.Mesh(axisGeo, axisMat);
        principalAxis.rotation.z = Math.PI / 2;
        scene.add(principalAxis);

        // Convex Lens Visual
        const lensGeo = new THREE.SphereGeometry(3, 32, 32);
        const lensMat = new THREE.MeshPhongMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.3 });
        const lens = new THREE.Mesh(lensGeo, lensMat);
        lens.scale.set(0.1, 1, 1);
        scene.add(lens);

        // Object and Image
        const objGeo = new THREE.CylinderGeometry(0, 0.3, 2);
        const objMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const objectArrow = new THREE.Mesh(objGeo, objMat);
        scene.add(objectArrow);

        const imgGeo = new THREE.CylinderGeometry(0, 0.3, 2);
        const imgMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const imageArrow = new THREE.Mesh(imgGeo, imgMat);
        scene.add(imageArrow);

        // Rays (Line)
        const rayMat = new THREE.LineBasicMaterial({ color: 0xffffff });
        let rayLines = new THREE.Group();
        scene.add(rayLines);

        const f = 4; // Focal Length

        function updateOptics() {
            const u = parseFloat(document.getElementById('u-slider').value);
            document.getElementById('u-val').innerText = u.toFixed(1);

            // Lens Formula: 1/v = 1/f + 1/u
            const v = 1 / ((1/f) + (1/u));
            const magnification = -v / u;

            // Update Object
            objectArrow.position.x = u;
            objectArrow.position.y = 1;

            // Update Image
            imageArrow.position.x = v;
            imageArrow.position.y = magnification; // Height changes based on mag
            imageArrow.scale.y = magnification;

            // UI Text
            const info = document.getElementById('image-info');
            if (u > -f) {
                info.innerHTML = `Type: Virtual & Erect<br>Position: ${Math.abs(v).toFixed(1)} (Same Side)`;
                imageArrow.material.color.setHex(0x00ff00);
            } else {
                info.innerHTML = `Type: Real & Inverted<br>Position: ${v.toFixed(1)} (Other Side)`;
                imageArrow.material.color.setHex(0xffff00);
            }

            // Draw Rays
            rayLines.clear();
            const points1 = [new THREE.Vector3(u, 1, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(v, magnification, 0)];
            const geo1 = new THREE.BufferGeometry().setFromPoints(points1);
            rayLines.add(new THREE.Line(geo1, rayMat));

            const points2 = [new THREE.Vector3(u, 1, 0), new THREE.Vector3(0, 0, 0), new THREE.Vector3(v, magnification, 0)];
            const geo2 = new THREE.BufferGeometry().setFromPoints(points2);
            rayLines.add(new THREE.Line(geo2, rayMat));
        }

        function playExplanation() {
            window.speechSynthesis.cancel();
            const u = Math.abs(parseFloat(document.getElementById('u-slider').value));
            let text = "";
            if (u > 2*f) text = "Object is beyond 2F. The image is real, inverted, and diminished.";
            else if (u === 2*f) text = "Object is at 2F. The image is real, inverted, and the same size.";
            else if (u > f) text = "Object is between F and 2F. The image is real, inverted, and magnified.";
            else text = "Object is inside the focus. The rays diverge, creating a virtual, erect, and highly magnified image. This is how a magnifying glass works!";
            
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        function animate() {
            requestAnimationFrame(animate);
            updateOptics();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
