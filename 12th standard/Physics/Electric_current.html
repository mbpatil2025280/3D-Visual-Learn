<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Electric Current - Physics Project</title>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #control-panel { position: absolute; top: 20px; left: 20px; width: 300px; background: rgba(0,0,0,0.85); padding: 20px; border-radius: 12px; border: 1px solid #00ff88; z-index: 10; }
        .slider-group { margin: 15px 0; }
        input[type=range] { width: 100%; accent-color: #00ff88; }
        button { background: #00ff88; color: black; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00cc6e; transform: scale(1.02); }
        #stats { margin-top: 15px; font-family: monospace; color: #00ff88; }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2 style="margin:0 0 10px 0;">Electric Current</h2>
        <div class="slider-group">
            <label>Potential Difference (Voltage): <span id="v-val">5</span>V</label>
            <input type="range" id="voltage-slider" min="0" max="20" step="0.5" value="5">
        </div>
        <div id="stats">Current (I) ∝ Voltage (V)</div>
        <button onclick="playVoice()">🔊 Start Audio Lesson</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        // --- 2. Create the Conductor (Wire) ---
        const wireGeo = new THREE.CylinderGeometry(2, 2, 20, 32, 1, true);
        const wireMat = new THREE.MeshPhongMaterial({ 
            color: 0x444444, 
            transparent: true, 
            opacity: 0.2, 
            side: THREE.DoubleSide 
        });
        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.rotation.z = Math.PI / 2;
        scene.add(wire);

        // Add Wire Edges for visibility
        const edges = new THREE.EdgesGeometry(wireGeo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.3 }));
        line.rotation.z = Math.PI / 2;
        scene.add(line);

        // Lights
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(5, 5, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 3. Electrons (Particle System) ---
        const electronCount = 100;
        const electrons = [];
        const electronGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const electronMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

        for(let i=0; i<electronCount; i++) {
            const electron = new THREE.Mesh(electronGeo, electronMat);
            // Random position inside the cylinder
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 1.8;
            electron.position.y = Math.cos(angle) * radius;
            electron.position.z = Math.sin(angle) * radius;
            electron.position.x = (Math.random() - 0.5) * 20;
            scene.add(electron);
            electrons.push(electron);
        }

        // --- 4. Animation & Logic ---
        const slider = document.getElementById('voltage-slider');
        
        function playVoice() {
            window.speechSynthesis.cancel();
            const text = `Electric current is the flow of electric charge. In a solid conductor like this wire, the charge carriers are electrons. 
            When you increase the voltage using the slider, you are increasing the electric pressure. 
            This causes the electrons to drift faster. Notice that while individual electrons move randomly, 
            the overall flow is in one direction. This average speed is called Drift Velocity.`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            window.speechSynthesis.speak(utterance);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const voltage = parseFloat(slider.value);
            document.getElementById('v-val').innerText = voltage;
            const driftSpeed = voltage * 0.02;

            electrons.forEach(e => {
                e.position.x += driftSpeed;
                // Add "jiggle" for thermal motion
                e.position.y += (Math.random() - 0.5) * 0.05;
                e.position.z += (Math.random() - 0.5) * 0.05;

                // Reset position to loop through wire
                if(e.position.x > 10) e.position.x = -10;
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
